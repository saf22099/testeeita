<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coordenada — fichas de personagem</title>
<style>
  :root{
    --bg: #101216;
    --panel: #171a21;
    --panel-2: #1e222b;
    --line: #2a2f3b;
    --steel: #8fa3ad;
    --steel-dim: #5b6773;
    --brass: #b8862f;
    --brass-soft: #8f6a26;
    --parchment: #eee6d3;
    --blood: #8a2f36;
    --blood-soft: #a8434a;
    --moss: #4d6b4f;
    --moss-soft: #5f8062;
    --ink: #cfd6da;
    --ink-dim: #7c8890;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(184,134,47,0.06), transparent 60%);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  #app{ display:flex; height:100vh; overflow:hidden; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px; flex:none;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    padding:20px 14px;
    overflow-y:auto;
  }
  .brand{ font-family:var(--serif); font-size:21px; color:var(--parchment); margin:0 6px 2px; letter-spacing:0.01em;}
  .brand-sub{ margin:0 6px 18px; font-size:11.5px; color:var(--steel-dim); }
  .char-list{ display:flex; flex-direction:column; gap:4px; }
  .char-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 9px; border-radius:7px;
    border-left:3px solid transparent;
    cursor:pointer; transition:background .15s ease;
  }
  .char-item:hover{ background:var(--panel-2); }
  .char-item.active{ background:var(--panel-2); border-left-color:var(--brass); }
  .char-item-info{ flex:1; min-width:0; }
  .char-item-name{ font-size:13.5px; color:var(--parchment); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .char-item-sub{ font-size:11px; color:var(--steel-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{ background:none; border:none; color:var(--steel-dim); cursor:pointer; padding:5px; border-radius:6px; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-btn:hover{ color:var(--blood-soft); background:rgba(138,47,54,0.14); }
  .icon-btn svg{ width:14px; height:14px; }
  .dup-btn:hover{ color:var(--brass); background:rgba(184,134,47,0.14); }

  .new-char-btn{
    margin-top:12px; display:flex; align-items:center; justify-content:center; gap:7px;
    padding:9px; border-radius:7px; border:1px dashed var(--line);
    background:transparent; color:var(--ink); font-size:13px; cursor:pointer;
  }
  .new-char-btn:hover{ border-color:var(--brass-soft); color:var(--parchment); }
  .new-char-btn svg{ width:14px; height:14px; }

  .sidebar-foot{ margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .link-btn{ background:none; border:none; color:var(--steel-dim); font-size:12px; text-align:left; cursor:pointer; padding:3px 4px; display:flex; align-items:center; gap:7px; }
  .link-btn:hover{ color:var(--parchment); }
  .link-btn svg{ width:12.5px; height:12.5px; }
  .save-indicator{ font-size:10.5px; color:var(--steel-dim); padding:2px 4px; }
  .save-indicator.saved::before{ content:"● "; color:var(--moss-soft); }
  .save-indicator.saving::before{ content:"● "; color:var(--brass); }
  .save-indicator.error::before{ content:"● "; color:var(--blood-soft); }

  /* ---------- Main ---------- */
  .main{ flex:1; overflow-y:auto; padding:26px 26px 70px; }
  .empty-state{ margin:auto; text-align:center; max-width:380px; color:var(--steel-dim); padding-top:14vh; }
  .empty-state h2{ font-family:var(--serif); color:var(--parchment); font-weight:500; font-size:23px; margin-bottom:8px; }
  .empty-state button{ margin-top:18px; }

  .sheet-wrap{ max-width:980px; margin:0 auto; }

  .sheet-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap; }
  .name-input{
    font-family:var(--serif); font-size:28px; color:var(--parchment);
    background:transparent; border:none; border-bottom:1px solid transparent;
    padding:2px 0; flex:1; min-width:220px;
  }
  .name-input:focus{ outline:none; border-bottom:1px solid var(--brass-soft); }
  .name-input::placeholder{ color:var(--steel-dim); }
  .top-actions{ display:flex; gap:8px; flex:none; }
  .btn{
    display:flex; align-items:center; gap:7px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--ink); padding:8px 13px; border-radius:7px;
    font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover{ border-color:var(--brass-soft); color:var(--parchment); }
  .btn svg{ width:13px; height:13px; }
  .btn.primary{ background:var(--brass-soft); border-color:var(--brass-soft); color:#1a1408; font-weight:600; }
  .btn.primary:hover{ background:var(--brass); }

  /* Tabs */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto; }
  .tab-btn{
    background:none; border:none; color:var(--steel-dim); padding:9px 14px; font-size:12.5px;
    cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab-btn:hover{ color:var(--parchment); }
  .tab-btn.active{ color:var(--parchment); border-bottom-color:var(--brass); }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-bottom:16px; }
  .card h3{ font-family:var(--serif); font-size:16px; color:var(--parchment); margin:0 0 14px; font-weight:500; }
  .card h3 small{ font-family:var(--sans); font-size:11px; color:var(--steel-dim); font-weight:400; margin-left:8px; }
  .grid{ display:grid; gap:12px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  .grid-5{ grid-template-columns:repeat(5,1fr); }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11px; color:var(--steel-dim); }
  .field input, .field select, .field textarea{
    font-size:13.5px; color:var(--parchment); background:var(--panel-2);
    border:1px solid var(--line); border-radius:6px; padding:8px 9px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brass-soft); }
  .field textarea{ resize:vertical; line-height:1.5; }
  .hint{ font-size:11px; color:var(--steel-dim); margin-top:2px; line-height:1.5;}

  /* attributes */
  .attr-card{ position:relative; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:12px 10px 14px; text-align:center; }
  .attr-card .attr-label{ font-size:11.5px; color:var(--steel-dim); margin-bottom:8px; }
  .attr-steppers{ display:flex; align-items:center; justify-content:center; gap:6px; }
  .step-btn{ width:24px; height:24px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--parchment); cursor:pointer; font-size:14px; line-height:1; }
  .step-btn:hover{ border-color:var(--brass-soft); }
  .attr-value{ font-family:var(--serif); font-size:24px; color:var(--parchment); width:36px; text-align:center; }
  .attr-temp{ margin-top:8px; }
  .attr-temp input{ width:48px; text-align:center; font-size:12px; padding:4px; background:var(--panel); border:1px solid var(--line); border-radius:5px; color:var(--ink); }
  .attr-temp label{ font-size:10px; color:var(--steel-dim); display:block; margin-bottom:3px; }
  .attr-bonuses{ font-size:10.5px; color:var(--brass); margin-top:6px; line-height:1.4; min-height:14px; }

  /* resources */
  .resource-row{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .resource-card{ border-radius:9px; padding:14px 16px; border:1px solid var(--line); }
  .resource-card.pv{ background:linear-gradient(180deg, rgba(138,47,54,0.14), rgba(138,47,54,0.02)); }
  .resource-card.pde{ background:linear-gradient(180deg, rgba(184,134,47,0.13), rgba(184,134,47,0.02)); }
  .resource-card.san{ background:linear-gradient(180deg, rgba(90,110,160,0.15), rgba(90,110,160,0.02)); }
  .resource-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .resource-head .label{ font-size:12px; color:var(--steel-dim); font-family:var(--serif); font-size:14px; }
  .resource-state{ font-size:10px; padding:2px 7px; border-radius:20px; text-transform:uppercase; letter-spacing:0.03em; }
  .state-ok{ background:rgba(95,128,98,0.25); color:var(--moss-soft); }
  .state-alert{ background:rgba(184,134,47,0.22); color:var(--brass); }
  .state-crit{ background:rgba(168,67,74,0.25); color:var(--blood-soft); }
  .resource-values{ display:flex; align-items:baseline; gap:6px; }
  .resource-values input{ font-family:var(--serif); font-size:22px; width:52px; text-align:center; background:var(--panel-2); border:1px solid var(--line); border-radius:6px; color:var(--parchment); padding:2px 0; }
  .resource-values .slash{ color:var(--steel-dim); font-size:16px; }
  .resource-bar-track{ margin-top:9px; height:6px; border-radius:3px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .resource-bar-fill{ height:100%; border-radius:3px; transition:width .2s ease; }
  .pv .resource-bar-fill{ background:var(--blood-soft); }
  .pde .resource-bar-fill{ background:var(--brass); }
  .san .resource-bar-fill{ background:#7891c9; }
  .quick-dmg{ display:flex; gap:5px; margin-top:10px; flex-wrap:wrap; }
  .quick-dmg button{ font-size:11px; padding:5px 8px; border-radius:5px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  .quick-dmg button:hover{ border-color:var(--brass-soft); color:var(--parchment); }
  .quick-dmg button.heal{ color:var(--moss-soft); }
  .quick-dmg button.dmg{ color:var(--blood-soft); }

  .derived-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px; }
  .derived-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; }
  .derived-card .dv{ font-family:var(--serif); font-size:20px; color:var(--parchment); }
  .derived-card .dl{ font-size:10.5px; color:var(--steel-dim); margin-top:2px; }

  /* skills table */
  .skills-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; }
  .skill-row{ display:grid; grid-template-columns:1fr 60px 34px 34px 34px; align-items:center; gap:6px; padding:6px 4px; border-bottom:1px solid var(--line); }
  .skill-row .sname{ font-size:12.5px; color:var(--ink); }
  .skill-row select{ font-size:10.5px; padding:3px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--steel-dim); }
  .skill-row input.spts{ width:32px; text-align:center; font-size:12.5px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--parchment); padding:3px 0; }
  .skill-total{ font-family:var(--serif); font-size:14px; color:var(--brass); text-align:center; }
  .roll-btn{ background:var(--panel-2); border:1px solid var(--line); border-radius:5px; color:var(--steel-dim); cursor:pointer; font-size:12px; padding:3px 5px; }
  .roll-btn:hover{ border-color:var(--brass-soft); color:var(--brass); }

  /* talents/defects */
  .td-summary{ display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap; }
  .td-stat{ font-size:12px; color:var(--steel-dim); }
  .td-stat b{ color:var(--parchment); font-family:var(--serif); font-size:15px; }
  .td-cols{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  .td-list{ display:flex; flex-direction:column; gap:6px; max-height:360px; overflow-y:auto; padding-right:4px; }
  .td-item{ display:flex; align-items:flex-start; gap:8px; padding:8px 9px; border-radius:7px; border:1px solid var(--line); background:var(--panel-2); cursor:pointer; }
  .td-item:hover{ border-color:var(--brass-soft); }
  .td-item.picked{ border-color:var(--brass); background:rgba(184,134,47,0.09); }
  .td-item input{ margin-top:2px; }
  .td-item-body{ flex:1; }
  .td-item-name{ font-size:12.5px; color:var(--parchment); display:flex; justify-content:space-between; gap:6px; }
  .td-item-cost{ color:var(--brass); font-size:11px; }
  .td-item-desc{ font-size:11px; color:var(--steel-dim); margin-top:2px; line-height:1.4; }

  /* abilities */
  .ability-filters{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-chip{ font-size:11.5px; padding:6px 11px; border-radius:20px; border:1px solid var(--line); background:var(--panel-2); color:var(--steel-dim); cursor:pointer; }
  .filter-chip:hover{ color:var(--parchment); }
  .filter-chip.active{ border-color:var(--brass); color:var(--brass); background:rgba(184,134,47,0.1); }
  .ability-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .ability-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px 13px; cursor:pointer; }
  .ability-card:hover{ border-color:var(--brass-soft); }
  .ability-card.acquired{ border-color:var(--moss-soft); }
  .ability-card-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .ability-name{ font-size:13.5px; color:var(--parchment); font-family:var(--serif); }
  .ability-tag{ font-size:9.5px; padding:2px 7px; border-radius:20px; background:rgba(95,128,98,0.25); color:var(--moss-soft); white-space:nowrap; }
  .ability-desc{ font-size:11.5px; color:var(--steel-dim); margin-top:6px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--panel); border:1px solid var(--line); border-radius:12px; max-width:560px; width:100%; max-height:82vh; overflow-y:auto; padding:24px; }
  .modal h2{ font-family:var(--serif); color:var(--parchment); margin:0 0 4px; font-size:20px; }
  .modal .modal-close{ float:right; }
  .modal-level-tabs{ display:flex; gap:6px; margin:14px 0; }
  .modal-level-tabs button{ flex:1; padding:7px; border-radius:6px; border:1px solid var(--line); background:var(--panel-2); color:var(--steel-dim); cursor:pointer; font-size:12px; }
  .modal-level-tabs button.active{ border-color:var(--brass); color:var(--brass); }
  .modal-body-text{ font-size:13px; line-height:1.7; color:var(--ink); white-space:pre-line; }
  .modal-cost{ margin-top:12px; font-size:12px; color:var(--brass); }
  .modal-actions{ margin-top:18px; display:flex; gap:8px; justify-content:flex-end; }

  .custom-ability-card{ background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:12px 13px; margin-bottom:10px; }

  /* lists: weapons / inventory */
  .table-rows{ display:flex; flex-direction:column; gap:6px; }
  .weapon-row{ display:grid; grid-template-columns: 1.3fr 0.6fr 0.8fr 0.6fr 0.8fr 0.8fr 1fr 30px; gap:6px; align-items:center; }
  .item-row{ display:grid; grid-template-columns: 1.6fr 0.6fr 0.6fr 1.3fr 30px; gap:6px; align-items:center; }
  .mount-item-row{ display:grid; grid-template-columns: 1.6fr 0.6fr 30px; gap:6px; align-items:center; }
  .table-rows input{ font-size:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:5px; padding:6px 7px; color:var(--parchment); }
  .table-rows input:focus{ outline:none; border-color:var(--brass-soft); }
  .row-remove{ display:flex; align-items:center; justify-content:center; background:none; border:none; cursor:pointer; color:var(--steel-dim); padding:4px; }
  .row-remove:hover{ color:var(--blood-soft); }
  .row-remove svg{ width:14px; height:14px; }
  .table-add{ margin-top:8px; background:transparent; border:1px dashed var(--line); border-radius:6px; color:var(--steel-dim); cursor:pointer; font-size:12.5px; padding:8px; display:flex; align-items:center; justify-content:center; gap:6px; width:100%; }
  .table-add:hover{ border-color:var(--brass-soft); color:var(--parchment); }
  .table-add svg{ width:13px; height:13px; }
  .col-labels{ display:grid; gap:6px; font-size:10px; color:var(--steel-dim); margin-bottom:4px; padding:0 2px; }
  .list-empty{ font-size:12px; color:var(--steel-dim); font-style:italic; padding:6px 2px; }

  .capacity-bar-wrap{ margin-top:6px; }
  .capacity-label{ font-size:11.5px; color:var(--steel-dim); display:flex; justify-content:space-between; margin-bottom:4px; }
  .capacity-bar-track{ height:8px; border-radius:4px; background:rgba(255,255,255,0.06); overflow:hidden; }
  .capacity-bar-fill{ height:100%; background:var(--brass); border-radius:4px; }
  .capacity-bar-fill.over{ background:var(--blood-soft); }
  .overload-warn{ font-size:11.5px; color:var(--blood-soft); margin-top:6px; }

  .roll-log{ margin-top:12px; display:flex; flex-direction:column; gap:5px; max-height:160px; overflow-y:auto; }
  .roll-entry{ font-size:12px; color:var(--steel-dim); font-family:var(--mono); background:var(--panel-2); border-radius:5px; padding:6px 9px; display:flex; justify-content:space-between; }
  .roll-entry b{ color:var(--brass); }

  .notes-field textarea{ width:100%; min-height:100px; }

  select.select-field{ width:100%; }

  #import-input{ display:none; }

  @media (max-width: 900px){
    .grid-3, .grid-4, .grid-5{ grid-template-columns:repeat(2,1fr); }
    .resource-row{ grid-template-columns:1fr; }
    .skills-grid{ grid-template-columns:1fr; }
    .td-cols{ grid-template-columns:1fr; }
    .ability-grid{ grid-template-columns:1fr; }
  }
  @media (max-width: 760px){
    #app{ flex-direction:column; }
    .sidebar{ width:100%; flex-direction:row; align-items:center; padding:10px; gap:8px; overflow-x:auto; height:auto;}
    .brand,.brand-sub{ display:none; }
    .char-list{ flex-direction:row; }
    .char-item{ flex:none; min-width:140px; }
    .new-char-btn{ margin-top:0; flex:none; white-space:nowrap; }
    .sidebar-foot{ display:none; }
    .main{ padding:16px 12px 50px; }
    .grid-2,.grid-3,.grid-4,.grid-5{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="import-input" accept="application/json">

<script>
/* =========================================================================
   DADOS DO SISTEMA — Coordenada RPG (baseado no livro de regras enviado)
   ========================================================================= */

const ATRIBUTOS = [
  {key:'agi', nome:'Agilidade'},
  {key:'est', nome:'Estamina'},
  {key:'for', nome:'Força'},
  {key:'int', nome:'Intelecto'},
  {key:'vit', nome:'Vitalidade'},
];

const PERICIAS = {
  crime:        {nome:'Crime',        attrs:['int','agi']},
  furtividade:  {nome:'Furtividade',  attrs:['int','agi']},
  pontaria:     {nome:'Pontaria',     attrs:['agi']},
  luta:         {nome:'Luta',         attrs:['for','agi']},
  fortitude:    {nome:'Fortitude',    attrs:['vit','est']},
  intimidacao:  {nome:'Intimidação',  attrs:['int','for']},
  carisma:      {nome:'Carisma',      attrs:['int']},
  exploracao:   {nome:'Exploração',   attrs:['int']},
  historia:     {nome:'História',     attrs:['int']},
  mecanica:     {nome:'Mecânica',     attrs:['int']},
  medicina:     {nome:'Medicina',     attrs:['int']},
  natureza:     {nome:'Natureza',     attrs:['int']},
  tatica:       {nome:'Tática',       attrs:['int']},
  vontade:      {nome:'Vontade',      attrs:['int']},
};

const ORIGENS = {
  sangue_real:{ nome:'Sangue Real (Fritz/Reiss)', pdv:8, san:8, pde:4,
    passiva:'Adicione +1 ao atributo de Intelecto.',
    habOrigem:'Vontade do Rei — todas as recuperações de Sanidade feitas pelo personagem (ou por aliados próximos) recuperam 1d8 ao invés de 1d4.' },
  fazendeiro:{ nome:'Fazendeiro (Braus)', pdv:10, san:6, pde:6,
    passiva:'Sempre que realizar um teste de Natureza, adicione vantagem.',
    habOrigem:'Instinto Selvagem — em áreas rurais, a margem de crítico dos testes do personagem é reduzida em -1.' },
  cientista:{ nome:'Cientista (Zoe)', pdv:8, san:8, pde:6,
